name: Deploy

# Despliega a Cloudflare Workers al hacer push a main.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita que dos despliegues se pisen entre sí. A diferencia de CI, acá NO
# cancelamos el anterior: un deploy a medias puede dejar el worker inconsistente.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Ver la nota en ci.yml: `npm ci` falla porque el lockfile se genera en
      # Windows y no incluye las dependencias transitivas de los binarios linux
      # de sharp (vía miniflare/wrangler).
      - name: Instalar dependencias
        run: npm install --no-save --no-audit --no-fund

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

      # Se invoca wrangler directamente (y no cloudflare/wrangler-action) porque
      # la acción corre `npx --no-install` dentro de workingDirectory: como
      # .output/server no tiene node_modules, resolvía una wrangler v3 del cache
      # del runner, incompatible con el wrangler.json que genera nitro 3.
      # Acá usamos la v4 fijada en package.json y le pasamos la config con -c.
      - name: Desplegar a Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy -c .output/server/wrangler.json | tee deploy.log
          # La URL del worker se extrae de la salida para publicarla como
          # output del step (el `environment.url` del job la consume).
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Resumen del despliegue
        run: |
          echo "### Despliegue completado :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker:** ctell-admin-hub" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Wrangler:** \`$(npx wrangler --version)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
