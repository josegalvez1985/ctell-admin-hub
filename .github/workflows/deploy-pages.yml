name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # No cancelar un deploy en curso: cancelarlo a mitad puede dejar el entorno
  # github-pages colgado y encolar los siguientes indefinidamente. Se encola.
  cancel-in-progress: false

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Ver la nota en ci.yml: `npm ci` falla porque el lockfile se genera en
      # Windows y no trae las dependencias transitivas de los binarios linux.
      - name: Instalar dependencias
        run: npm install --no-save --no-audit --no-fund

      # El sitio se sirve en la raíz de www.ctell.online, así que el build no
      # lleva prefijo: `base` es "/" fijo en vite.config.ts.
      - name: Build (SPA estático)
        run: npm run build

      # Renombra el shell a index.html/404.html y agrega .nojekyll. Ver
      # scripts/preparar-shell.mjs para el detalle de qué genera y por qué.
      - name: Preparar salida para Pages
        run: node scripts/preparar-shell.mjs

      # El artefacto reemplaza el sitio entero en cada deploy: si CNAME no
      # viaja adentro, Pages pierde el dominio propio y vuelve a
      # josegalvez1985.github.io. Vite copia public/ tal cual, así que el
      # archivo ya debería estar; el chequeo corta el deploy si alguien lo
      # borró, en vez de descubrirlo con el sitio caído.
      - name: Verificar CNAME
        run: test -f dist/client/CNAME && cat dist/client/CNAME

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
