name: CI

# Validación de calidad: corre en cada push a main y en cada pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` exige que el lockfile coincida exactamente con el árbol que
      # npm resuelve en ESTA plataforma. El lockfile se genera en Windows, donde
      # npm omite los binarios linux de sharp (dependencia de miniflare/wrangler)
      # y con ellos sus dependencias transitivas, así que en el runner Linux
      # falta lru-cache@11 y `npm ci` aborta.
      # `npm install --no-save` instala el árbol correcto para Linux respetando
      # las versiones del lockfile, sin reescribirlo.
      - name: Instalar dependencias
        run: npm install --no-save --no-audit --no-fund

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build de producción
        run: npm run build
