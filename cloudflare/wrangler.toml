# Worker que hace de proxy a ORDS para la versión web. Ver worker.js.
#
# Requisito: el dominio ctell.online tiene que estar administrado por
# Cloudflare (nameservers apuntados desde Hostinger). Sin eso, la ruta de abajo
# no puede interceptar nada.
#
# Desplegar:  npx wrangler deploy --config cloudflare/wrangler.toml

name = "ctell-ords-proxy"
main = "worker.js"
compatibility_date = "2026-08-11"

# Intercepta solo /ords/*; el resto del sitio lo sigue sirviendo GitHub Pages.
[[routes]]
pattern = "www.ctell.online/ords/*"
zone_name = "ctell.online"
